<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yousef Taha - معرض الآيفون 3D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo', sans-serif}
  html,body{overflow-x:hidden} /* منع اي حركة في الصفحة */
  body{background:#000;color:#fff}

  /* خلفية فضاء ثابتة */
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=2071') center/cover fixed;opacity:0.3;z-index:-3}

  /* نجوم اكبر */
.stars{position:fixed;width:100%;height:100%;z-index:-2}
.stars span{position:absolute;background:#fff;border-radius:50%;animation:twinkle 4s infinite}
  @keyframes twinkle{0%,100%{opacity:0.3} 50%{opacity:1}}

  /* كواكب في الخلفية */
.planet-bg{position:fixed;border-radius:50%;z-index:-2;opacity:0.6}
.p1{width:120px;height:120px;background:radial-gradient(circle at 30% 30%,#ff9a9e,#c471ed);top:15%;left:8%;animation:float 20s ease-in-out infinite}
.p2{width:80px;height:80px;background:radial-gradient(circle at 30% 30%,#a1c4fd,#c2e9fb);bottom:20%;right:10%;animation:float 25s ease-in-out infinite reverse}
.p3{width:150px;height:150px;background:radial-gradient(circle at 30% 30%,#fbc2eb,#a6c1ee);top:60%;left:85%;animation:float 30s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0px)} 50%{transform:translateY(-30px)}}

  /* القمر شمال فوق */
.moon{position:fixed;top:80px;left:50px;width:100px;height:100px;background:#ddd;border-radius:50%;box-shadow:inset -20px -10px 0 0 #bbb, 0 0 40px #fff;z-index:-1}

.shooting-star{position:absolute;width:2px;height:2px;background:#fff;box-shadow:0 0 10px 2px #fff;animation:shoot 5s linear infinite}
.shooting-star::after{content:'';position:absolute;width:120px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.8));transform:translateX(-120px)}
  @keyframes shoot{0%{transform:translate(0,0) rotate(45deg);opacity:0} 10%{opacity:1} 100%{transform:translate(900px,900px) rotate(45deg);opacity:0}}

  header{text-align:center;padding:50px 20px;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);position:relative;z-index:2}
  header h1{font-size:42px;color:#fff;text-shadow:0 0 25px #0071e3}

.gallery{max-width:1100px;margin:0 auto;padding:100px 20px;position:relative;z-index:2}
.planet{display:flex;align-items:center;justify-content:center;margin:150px 0;height:420px;position:relative}

  /* مكان المجسم 3D بس هو اللي بيتحرك */
.model-viewer{width:320px;height:400px;position:relative;transition:0.5s}
.planet:hover.model-viewer{transform:scale(1.2)} /* تكبير عند الماوس */
.glow{position:absolute;top:50%;left:50%;width:450px;height:450px;background:radial-gradient(circle,rgba(0,113,227,0.25) 0%,transparent 70%);border-radius:50%;transform:translate(-50%,-50%);animation:pulse 4s ease-in-out infinite;z-index:-1}
  @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.5} 50%{transform:translate(-50%,-50%) scale(1.3);opacity:0.8}}

.info{text-align:center;margin-top:30px}
.info h2{font-size:34px;margin-bottom:10px;color:#fff;text-shadow:0 0 20px #0071e3}
.info.price{font-size:28px;color:#0071e3;font-weight:bold;margin-bottom:20px}
.info.btn{padding:14px 35px;background:#25D366;color:#fff;border-radius:14px;text-decoration:none;font-weight:bold;display:inline-block}

#musicBtn{position:fixed;bottom:25px;right:25px;background:#0071e3;color:#fff;border:none;border-radius:50%;width:60px;height:60px;font-size:26px;cursor:pointer;z-index:999}
.popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);display:none;justify-content:center;align-items:center;z-index:999}
.popup-content{background:#fff;color:#000;width:90%;max-width:500px;border-radius:20px;padding:30px;position:relative}
.close{position:absolute;top:15px;left:20px;font-size:28px;cursor:pointer;color:#999}
.specs{text-align:right;margin:20px 0}
.specs p{margin:8px 0;padding:10px;background:#f5f5f7;border-radius:10px}
footer{text-align:center;padding:25px;background:rgba(0,0,0,0.7);color:#aaa;position:relative;z-index:2}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div id="shootingStars"></div>
<div class="planet-bg p1"></div>
<div class="planet-bg p2"></div>
<div class="planet-bg p3"></div>
<div class="moon"></div>

<header><h1>Yousef Taha</h1><p>معرض الآيفون - مجسمات 3D في الفضاء</p></header>

<section class="gallery">
  <div class="planet">
    <div style="position:relative">
      <div class="glow"></div>
      <canvas id="model1" class="model-viewer"></canvas>
    </div>
    <div class="info"><h2>iPhone X Max</h2><p class="price">10,000 جنيه</p><a href="#" class="btn" onclick="openPopup('xs')">التفاصيل</a></div>
  </div>

  <div class="planet">
    <div style="position:relative">
      <div class="glow"></div>
      <canvas id="model2" class="model-viewer"></canvas>
    </div>
    <div class="info"><h2>iPhone 11 Pro</h2><p class="price">20,000 جنيه</p><a href="#" class="btn" onclick="openPopup('11pro')">التفاصيل</a></div>
  </div>

  <div class="planet">
    <div style="position:relative">
      <div class="glow"></div>
      <canvas id="model3" class="model-viewer"></canvas>
    </div>
    <div class="info"><h2>iPhone 12</h2><p class="price">22,000 جنيه</p><a href="#" class="btn" onclick="openPopup('12')">التفاصيل</a></div>
  </div>

  <div class="planet">
    <div style="position:relative">
      <div class="glow"></div>
      <canvas id="model4" class="model-viewer"></canvas>
    </div>
    <div class="info"><h2>iPhone 15</h2><p class="price">50,000 جنيه</p><a href="#" class="btn" onclick="openPopup('15')">التفاصيل</a></div>
  </div>
</section>

<button id="musicBtn" onclick="toggleMusic()">🔊</button>
<audio id="spaceSound" loop><source src="https://cdn.pixabay.com/audio/2025/04/10/audio_2f3b4c5d6e.mp3" type="audio/mpeg"></audio>

<div id="popup" class="popup" onclick="closePopup()"><div class="popup-content" onclick="event.stopPropagation()"><span class="close" onclick="closePopup()">&times;</span><div id="popup-data"></div></div></div>

<footer>© 2026 Yousef Taha. للتواصل: 01142967322 | الإسكندرية</footer>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"></script>

<script>
function loadModel(canvasId, modelPath){
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 320/400, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({canvas: document.getElementById(canvasId), alpha: true, antialias: true});
  renderer.setSize(320, 400);

  const light = new THREE.DirectionalLight(0xffffff, 2);
  light.position.set(3,3,5);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x666666, 1.2));

  const loader = new THREE.GLTFLoader();
  loader.load(modelPath, (gltf) => {
    const model = gltf.scene;
    scene.add(model);
    model.scale.set(1.6,1.6,1.6);
    camera.position.z = 5;

    // بس المجسم هو اللي بيتحرك
    let angle = 0;
    function animate(){
      requestAnimationFrame(animate);
      angle += 0.005;
      model.rotation.y += 0.008; // دوران
      model.position.y = Math.sin(angle) * 0.15; // تعويم
      renderer.render(scene, camera);
    }
    animate();
  });
}

loadModel('model1', 'iphone-xs-max.glb');
loadModel('model2', 'iphone-11-pro.glb');
loadModel('model3', 'iphone-12.glb');
loadModel('model4', 'iphone-15.glb');

// نجوم اكبر واكتر
const stars = document.getElementById('stars');
for(let i=0;i<150;i++){
  let s=document.createElement('span');
  s.style.left=Math.random()*100+'%';
  s.style.top=Math.random()*100+'%';
  s.style.width = Math.random()*4 + 2 + 'px'; // من 2 ل 6 بكسل
  s.style.height = s.style.width;
  s.style.animationDelay=Math.random()*4+'s';
  stars.appendChild(s);
}

// شهب
const shootingContainer = document.getElementById('shootingStars');
function createShootingStar(){let s=document.createElement('div');s.className='shooting-star';s.style.top=Math.random()*60+'%';s.style.left='-150px';shootingContainer.appendChild(s);setTimeout(()=>s.remove(),5000);}
setInterval(createShootingStar,2500);

// موسيقى
let musicPlaying=false;
function toggleMusic(){
  const m=document.getElementById('spaceSound');
  m.volume=0.4;
  if(musicPlaying){m.pause();musicPlaying=false;document.getElementById('musicBtn').innerText='🔇'}
  else{m.play();musicPlaying=true;document.getElementById('musicBtn').innerText='🔊'}
}
document.addEventListener('click',()=>{if(!musicPlaying) toggleMusic()},{once:true})

const phones = {
  xs: {name: "iPhone X Max", price: "10,000 جنيه", specs: ["الشاشة: 6.5 بوصة OLED", "الرام: 4 جيجا", "المساحة: 64 / 256 جيجا", "الكاميرا: كاميرتين 12 ميجا", "المعالج: A12 Bionic", "البطارية: 3174 مللي أمبير"]},
  '11pro': {name: "iPhone 11 Pro", price: "20,000 جنيه", specs: ["الشاشة: 5.8 بوصة XDR", "الرام: 4 جيجا", "المساحة: 64 / 256 / 512 جيجا", "الكاميرا: 3 كاميرات 12 ميجا", "المعالج: A13 Bionic", "البطارية: 3046 مللي أمبير"]},
  '12': {name: "iPhone 12", price: "22,000 جنيه", specs: ["الشاشة: 6.1 بوصة XDR", "الرام: 4 جيجا", "المساحة: 64 / 128 / 256 جيجا", "الكاميرا: كاميرتين 12 ميجا", "المعالج: A14 Bionic 5G", "البطارية: 2815 مللي أمبير"]},
  '15': {name: "iPhone 15", price: "50,000 جنيه", specs: ["الشاشة: 6.1 بوصة XDR", "الرام: 6 جيجا", "المساحة: 128 / 256 / 512 جيجا", "الكاميرا: 48 ميجا + 12 ميجا", "المعالج: A16 Bionic", "البطارية: 3349 مللي أمبير + Type-C"]}
};
function openPopup(id) {
  const phone = phones[id];
  document.getElementById('popup-data').innerHTML = `
    <h2 style="text-align:center;margin:15px 0">${phone.name}</h2>
    <p style="text-align:center;font-size:24px;color:#0071e3;font-weight:bold">${phone.price}</p>
    <div class="specs">${phone.specs.map(s => `<p><strong>✓</strong> ${s}</p>`).join('')}</div>
    <a href="https://wa.me/201142967322?text=عايز ${phone.name}" class="btn" style="width:100%;text-align:center;background:#25D366;color:#fff;padding:12px;border-radius:10px;text-decoration:none">اطلب عبر واتساب</a>
  `;
  document.getElementById('popup').style.display = 'flex';
}
function closePopup() {document.getElementById('popup').style.display = 'none';}
</script>
</body>
</html>
